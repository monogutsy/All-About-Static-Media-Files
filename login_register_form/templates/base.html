{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PaceBuk{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    {% block body %}<main class="page">
        <section class="auth-card" aria-labelledby="page-title">
            <a class="wordmark auth-wordmark" href="{% url 'accounts:home' %}">pacebuk</a>
            {% if messages %}
            {% for message in messages %}
            <p class="message{% if message.tags == 'error' %} message-error{% endif %}" role="status">{{ message }}</p>
            {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </section>
    </main>{% endblock %}
</body>

</html>
